<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configuration lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .stepper-line {
      height: 4px;
      flex-grow: 1;
      background-color: #cbd5e1;
      margin: 0 0.5rem;
      border-radius: 2px;
    }
    .stepper-circle-active {
      background-color: #2563eb;
      color: white;
      border: none;
    }
    .stepper-circle-inactive {
      background-color: white;
      color: #94a3b8;
      border: 2px solid #94a3b8;
    }
    .stepper-circle-completed {
      background-color: #2563eb;
      color: white;
      border: none;
      opacity: 0.7; 
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <nav class="bg-white shadow py-3 px-[110px]">
    <div class="flex justify-between items-center w-full">
      <div class="flex items-center">
        <svg class="w-6 h-6 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <h1 class="text-xl font-bold text-blue-600">MediCare</h1>
      </div>
    </div>
  </nav>
 <h1 class="text-2xl font-bold mt-8 ml-20">New Lab Test Configuration</h1>
  <div class="max-w-4xl mx-auto flex items-center justify-between px-6 mt-10 mb-6">
    <div id="step1Circle" class="w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-active">1</div>
    <div class="stepper-line" id="line1"></div>
    <div id="step2Circle" class="w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive">2</div>
    <div class="stepper-line" id="line2"></div>
    <div id="step3Circle" class="w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive">3</div>
    <div class="stepper-line" id="line3"></div>
  <div id="step4Circle" class="w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive">4</div>
  </div>
  <div class="max-w-4xl mx-auto py-10 bg-white rounded-lg shadow p-6 mt-0 relative">
    <div id="page1">
      <h1 class="text-2xl font-bold mt-4 ml-20">Lab Test Management</h1>
      <div class="max-w-4xl mx-auto mt-6 p-6 rounded-2xl"> 
        <div class="mb-6">
          <span class="font-bold text-lg">General Test Information:</span>
        </div>
        <div class="flex gap-4 mb-4">
          <div class="w-1/2 flex flex-col">
            <label for="testName" class="mb-2 font-semibold text-gray-700">Test Name<span class="text-red-500">*</span></label>
            <input id="testName" type="text" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter test name" />
          </div>
          <div class="w-1/2 flex flex-col">
            <label for="testCode" class="mb-2 font-semibold text-gray-700">Test Code<span class="text-red-500">*</span></label>
            <input id="testCode" type="text" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter test code" />
          </div>
        </div>

        <div class="flex gap-4 mb-4">
          <div class="w-1/2 flex flex-col">
            <label for="testCategory" class="mb-2 font-semibold text-gray-700">Test Category<span class="text-red-500">*</span></label>
            <!-- <input id="testCategory" type="text" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter test category" /> -->
            <select id="testCategory" class="rounded-lg border-2 border-gray-300 h-12 px-4 bg-white" >
    <option value="" disabled selected>Select test category</option>
    <option value="Blood Test">Blood Test</option>
    <option value="Urine Test">Urine Test</option>
    <option value="Saliva Test">Saliva Test</option>
    <option value="Stool Test">Stool Test</option>
    <option value="Biopsy">Biopsy</option>
    <option value="Imaging">Imaging</option>
  </select>
          </div>
          <div class="w-1/2 flex flex-col">
            <label for="sampleType" class="mb-2 font-semibold text-gray-700">Sample Type Required<span class="text-red-500">*</span></label>
            <!-- <input id="sampleType" type="text" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter sample type required" /> -->
             <select id="sampleType" class="rounded-lg border-2 border-gray-300 h-12 px-4 bg-white" >
    <option value="" disabled selected>Select sample type</option>
    <option value="Urine">Urine</option>
    <option value="Saliva">Saliva</option>
    <option value="Blood">Blood</option>
    <option value="Tissue">Tissue</option>
    <option value="Stool">Stool</option>
    <option value="Other">Other</option>
  </select>
          </div>
        </div>

        <div class="flex flex-col mb-4">
          <label for="specimenVolume" class="mb-2 font-semibold text-gray-700">Specimen Volume Needed<span class="text-red-500">*</span></label>
          <input id="specimenVolume" type="text" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter specimen volume needed" />
        </div>

        <div class="flex flex-col">
          <label for="testDescription" class="mb-2 font-semibold text-gray-700">Test Description / Notes (Optional)</label>
          <input id="testDescription" type="text" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter test description / notes (optional)" />
        </div>
        
        <div class="flex justify-end mt-8">
          <button id="nextBtn1" 
            class="bg-green-400 text-white rounded-md px-10 py-2 font-semibold hover:bg-green-500 disabled:bg-gray-300 disabled:cursor-not-allowed" 
            disabled>Next</button>
        </div>
      </div>
    </div>

    <div id="page2" style="display:none;">
      <div class="max-w-4xl mx-auto mt-8 p-6 rounded-2xl">
        <h1 class="text-2xl font-bold mb-6 text-blue-700">Test Parameters & Reference Values</h1>
        <div class="flex gap-4 mb-4">
          <div class="w-1/2 flex flex-col">
            <label for="parameterCount" class="mb-2 font-semibold text-gray-700">Parameter Count</label>
            <input id="parameterCount" type="number" class="rounded-lg border-2 border-gray-300 h-12 px-4" placeholder="Enter count" />
          </div>
          <div class="w-1/2 flex flex-col">
            <label for="addParam" class="mb-2 invisible">Add Parameters</label>
            <button id="addParam" class="rounded-lg border-2 border-gray-300 h-12 px-4 text-gray-700">+ Add Parameters</button>
          </div>
        </div>
        <div class="border-2 border-gray-300 rounded-2xl px-4 py-6">
          <div class="mb-4 font-semibold text-lg">Parameter 1</div>
          <div class="flex gap-4 mb-4">
            <input type="text" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4" placeholder="Parameter Name" />
            <input type="text" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4" placeholder="Unit of Measurement" />
            <input type="text" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4" placeholder="Result Type" />
          </div>
          <div class="flex gap-4 mb-4">
            <input type="text" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4" placeholder="Normal Range (Min)" />
            <input type="text" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4" placeholder="Normal Range (Max)" />
            <div class="flex items-center w-1/3">
              <label class="flex items-center ml-4">
                <span class="mr-2 font-semibold text-sm">Critical Value Alert</span>
                <input type="checkbox" class="ml-1 w-5 h-5" />
              </label>
            </div>
          </div>
        </div>
      </div>
  
      <div class="flex justify-between mt-8">
  <button id="backBtn2" 
    class="bg-gray-300 text-black rounded-md px-10 py-2 font-semibold hover:bg-gray-400">
    Back
  </button>
  <button id="nextBtn2" 
    class="bg-green-400 text-white rounded-md px-10 py-2 font-semibold hover:bg-green-500" 
    disabled>
    Next
  </button>
</div>
    </div>
    <div id="page3" style="display:none;">
      <div class="max-w-4xl mx-auto mt-8 p-6 border-2 border-gray-400 rounded-2xl mb-8">
        <div class="font-bold text-lg mb-4">Test Work Flow Settings</div>
        <div class="flex items-center gap-6">
          <input type="text" class="w-2/3 rounded-lg border-2 border-gray-300 h-10 px-4 text-center" placeholder="Turnaround Time (TAT)" />
          <label class="flex items-center gap-2">
            <span class="inline-block w-9 h-5 bg-gray-200 rounded-full relative align-middle">
              <span class="absolute left-1 top-1 w-3 h-3 bg-white border border-gray-400 rounded-full"></span>
            </span>
            <span class="text-sm ml-2">Pane Test</span>
          </label>
        </div>
      </div>

      <div class="max-w-4xl mx-auto p-6 border-2 border-gray-400 rounded-2xl mb-8">
        <div class="font-bold text-lg mb-4">Reporting & Display Settings</div>
        <div class="flex gap-6 mb-4">
          <input type="text" class="w-1/2 rounded-lg border-2 border-gray-300 h-10 px-4 text-center" placeholder="Report Group / Selection" />
          <input type="text" class="w-1/2 rounded-lg border-2 border-gray-300 h-10 px-4 text-center" placeholder="Report Format" />
        </div>
        <div class="flex items-center mt-2 ml-2 gap-2">
          <span class="inline-block w-9 h-5 bg-gray-200 rounded-full relative align-middle">
            <span class="absolute left-1 top-1 w-3 h-3 bg-white border border-gray-400 rounded-full"></span>
          </span>
          <span class="text-sm">Allow Comparison with Previous Reports</span>
        </div>
      </div>
<div class="flex justify-between mt-8">
  <button id="backBtn3" class="bg-gray-300 text-black rounded-md px-10 py-2 font-semibold hover:bg-gray-400">Back</button>
  <button id="nextBtn3" class="bg-green-400 text-white rounded-md px-10 py-2 font-semibold hover:bg-green-500" disabled>Next</button>
</div>
   
    </div>
  </div>
<div id="page4" style="display:none;">
  <div class="max-w-4xl mx-auto mt-8 p-6 border-2 border-gray-400 rounded-2xl bg-white shadow">
    <div class="font-bold text-lg mb-4">Administrative / Meta Data</div>
    <div class="flex gap-6 mb-4">
      <input id="adminCost" type="text" placeholder="Cost" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4 text-center" />
      <input id="adminDepartment" type="text" placeholder="Department" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4 text-center" />
      <input id="adminStatus" type="text" placeholder="Status" class="w-1/3 rounded-lg border-2 border-gray-300 h-10 px-4 text-center" />
    </div>
    <div class="flex justify-center gap-12 mt-8">
      <button id="cancelBtn" class="w-56 h-12 rounded-lg border-2 border-gray-300 text-lg bg-white">Cancel</button>
      <button id="saveBtn" class="w-56 h-12 rounded-lg border-2 border-gray-300 text-lg bg-white">Save Configuration</button>
    </div>
  </div>
</div>
  <script>
    const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const page3 = document.getElementById("page3");
const page4 = document.getElementById("page4");

const step1Circle = document.getElementById("step1Circle");
const step2Circle = document.getElementById("step2Circle");
const step3Circle = document.getElementById("step3Circle");
const step4Circle = document.getElementById("step4Circle");

const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");
const line3 = document.getElementById("line3");

const nextBtn1 = document.getElementById('nextBtn1');
const backBtn2 = document.getElementById('backBtn2');
const nextBtn2 = document.getElementById('nextBtn2');

const backBtn3 = document.getElementById("backBtn3");
const nextBtn3 = document.getElementById("nextBtn3");

const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");

let currentPage = 1;

function updatePage() {
  page1.style.display = currentPage === 1 ? "block" : "none";
  page2.style.display = currentPage === 2 ? "block" : "none";
  page3.style.display = currentPage === 3 ? "block" : "none";
  page4.style.display = currentPage === 4 ? "block" : "none";

  step1Circle.className = currentPage === 1 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-active"
    : currentPage > 1 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-completed"
    : "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive";

  step2Circle.className = currentPage === 2 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-active"
    : currentPage > 2 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-completed"
    : "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive";

  step3Circle.className = currentPage === 3 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-active"
    : currentPage > 3 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-completed"
    : "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive";

  step4Circle.className = currentPage === 4 ? "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-active"
    : "w-10 h-10 rounded-full flex items-center justify-center font-semibold cursor-pointer stepper-circle-inactive";

  line1.style.backgroundColor = currentPage > 1 ? "#2563eb" : "#cbd5e1";
  line2.style.backgroundColor = currentPage > 2 ? "#2563eb" : "#cbd5e1";
  line3.style.backgroundColor = currentPage > 3 ? "#2563eb" : "#cbd5e1";
}
const requiredFields = [
  document.getElementById('testName'),
  document.getElementById('testCode'),
  document.getElementById('testCategory'),
  document.getElementById('sampleType'),
  document.getElementById('specimenVolume')
];
function validateFields() {
  const allFilled = requiredFields.every(field => field.value.trim() !== '');
  nextBtn1.disabled = !allFilled;
}
requiredFields.forEach(field => field.addEventListener('input', validateFields));
validateFields();
nextBtn1.addEventListener('click', () => {
  if (currentPage < 4) {
    currentPage++;
    updatePage();
  }
});
const step2Inputs = page2.querySelectorAll('input[type="text"], input[type="number"]');
function validateStep2Fields() {
  const allFilled = Array.from(step2Inputs).every(input => input.value.trim() !== '');
  nextBtn2.disabled = !allFilled;
}
step2Inputs.forEach(input => input.addEventListener('input', validateStep2Fields));
validateStep2Fields();

backBtn2.addEventListener('click', () => {
  currentPage = 1;
  updatePage();
});
nextBtn2.addEventListener('click', () => {
  if (currentPage < 4) {
    currentPage++;
    updatePage();
  }
});
const step3Inputs = page3.querySelectorAll('input[type="text"]');
function validateStep3Fields() {
  const allFilled = Array.from(step3Inputs).every(input => input.value.trim() !== '');
  nextBtn3.disabled = !allFilled;
}
step3Inputs.forEach(input => input.addEventListener('input', validateStep3Fields));
validateStep3Fields();

backBtn3.addEventListener('click', () => {
  currentPage = 2;
  updatePage();
});
nextBtn3.addEventListener('click', () => {
  if (currentPage < 4) {
    currentPage++;
    updatePage();
  }
});
cancelBtn.addEventListener('click', () => {
  if (confirm("Are you sure you want to cancel configuration?")) {
    window.location.reload();
  }
});
saveBtn.addEventListener('click', () => {
  alert("Configuration saved successfully!");

});
step1Circle.addEventListener("click", () => { currentPage = 1; updatePage(); });
step2Circle.addEventListener("click", () => { currentPage = 2; updatePage(); });
step3Circle.addEventListener("click", () => { currentPage = 3; updatePage(); });
step4Circle.addEventListener("click", () => { currentPage = 4; updatePage(); });

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft" && currentPage > 1) {
    currentPage--;
    updatePage();
  } else if (event.key === "ArrowRight" && currentPage < 4) {
    currentPage++;
    updatePage();
  }
});

updatePage();
    
   
  </script>
</body>
</html>
