[supervisord]
nodaemon=true

[program:nodeapp]
directory=/app
command=npm run dev
autostart=true
autorestart=true
stderr_logfile=/var/log/nodeapp.err.log
stdout_logfile=/var/log/nodeapp.out.log

[program:pythonapp]
directory=/app
command=python app.py
autostart=true
autorestart=true
stderr_logfile=/var/log/pythonapp.err.log
stdout_logfile=/var/log/pythonapp.out.log